[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "resume-jd-matcher"
version = "0.1.0"
description = "Per-requirement resume vs. job-description matcher with evidence-validated LLM judging."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pydantic>=2.6",
  "openai>=1.40",
  "typer>=0.12",
  "python-dotenv>=1.0",
  "pypdf>=4.0",
  "python-docx>=1.1",
]

[project.optional-dependencies]
# Real semantic embeddings (downloads a small model from Hugging Face on first run).
st = ["sentence-transformers>=3.0"]
dev = ["pytest>=8.0"]

[project.scripts]
matcher = "matcher.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/matcher"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
